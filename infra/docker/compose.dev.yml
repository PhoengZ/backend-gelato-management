# Dev/Test override — adds host port mappings for local development & integration testing.
# Usage: docker compose -f compose.yml -f compose.dev.yml up

services:
  rabbitmq:
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI

  analytics-mongodb:
    ports:
      - "27017:27017"

  auth-postgres:
    ports:
      - "5433:5432"

  inventory-postgres:
    ports:
      - "5434:5432"

  catalog-redis:
    ports:
      - "6380:6379"

  analytics-service:
    ports:
      - "8080:8080"
