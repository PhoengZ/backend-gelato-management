name: gelato-management

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    networks:
      - gelato_network
    volumes:
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  analytics-mongodb:
    image: mongo:7.0
    container_name: analytics-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?MONGO_INITDB_ROOT_USERNAME is required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?MONGO_INITDB_ROOT_PASSWORD is required}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:?MONGO_INITDB_DATABASE is required}
    networks:
      - gelato_network
    volumes:
      - analytics_mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" localhost:27017/test
      interval: 10s
      timeout: 5s
      retries: 10

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:?AUTH_POSTGRES_DB is required}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}
    networks:
      - gelato_network
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:?INVENTORY_POSTGRES_DB is required}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:?INVENTORY_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
    networks:
      - gelato_network
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  fulfillment-postgres:
    image: postgres:16-alpine
    container_name: fulfillment-postgres
    environment:
      POSTGRES_DB: ${FULFILLMENT_POSTGRES_DB:?FULFILLMENT_POSTGRES_DB is required}
      POSTGRES_USER: ${FULFILLMENT_POSTGRES_USER:?FULFILLMENT_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${FULFILLMENT_POSTGRES_PASSWORD:?FULFILLMENT_POSTGRES_PASSWORD is required}
    networks:
      - gelato_network
    volumes:
      - fulfillment_postgres_data:/var/lib/postgresql/data
      - ../../fulfillment-service/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  order-postgres:
    image: postgres:16-alpine
    container_name: order-postgres
    environment:
      POSTGRES_DB: ${ORDER_POSTGRES_DB:?ORDER_POSTGRES_DB is required}
      POSTGRES_USER: ${ORDER_POSTGRES_USER:?ORDER_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${ORDER_POSTGRES_PASSWORD:?ORDER_POSTGRES_PASSWORD is required}
    networks:
      - gelato_network
    volumes:
      - order_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog-redis
    environment:
      REDIS_PASSWORD: ${CATALOG_REDIS_PASSWORD:?CATALOG_REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    networks:
      - gelato_network
    volumes:
      - catalog_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  analytics-service:
    image: phoeng/analytics-service:1.1.0
    container_name: analytics-service
    environment:
      PORT: "8080"
    env_file:
      - path: ../../analytics-service/.env
        required: false
    networks:
      - gelato_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      analytics-mongodb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  fulfillment-service:
    build:
      context: ../../fulfillment-service
    container_name: fulfillment-service
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${FULFILLMENT_POSTGRES_USER}:${FULFILLMENT_POSTGRES_PASSWORD}@fulfillment-postgres:5432/${FULFILLMENT_POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gelatoflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gelatoflow-api}
      # Empty keeps messaging disabled; when set, the service reconnects on its own.
      RABBITMQ_URL: ${FULFILLMENT_RABBITMQ_URL:-}
    networks:
      - gelato_network
    depends_on:
      fulfillment-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  notification-service:
    build:
      context: ../../notification-service
    container_name: notification-service
    environment:
      PORT: "8080"
      JWT_SECRET: ${NOTIFICATION_JWT_SECRET:-${JWT_SECRET:?JWT_SECRET is required}}
      JWT_ISSUER: ${JWT_ISSUER:-gelatoflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gelatoflow-api}
      # Empty keeps messaging disabled; the SSE endpoint still serves but nothing is pushed.
      RABBITMQ_URL: ${NOTIFICATION_RABBITMQ_URL:-}
    networks:
      - gelato_network
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  auth-service:
    build:
      context: ../../auth-service
    container_name: auth-service
    environment:
      PORT: "3001"
      DATABASE_URL: postgres://${AUTH_POSTGRES_USER}:${AUTH_POSTGRES_PASSWORD}@auth-postgres:5432/${AUTH_POSTGRES_DB}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gelatoflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gelatoflow-api}
      JWT_TTL: 15m
      BCRYPT_COST: 12
      REQUEST_TIMEOUT: 5s
    networks:
      - gelato_network
    depends_on:
      auth-postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  catalog-service:
    build:
      context: ../../catalog-service
    container_name: catalog-service
    environment:
      PORT: "3002"
      GRPC_ADDR: ":50052"
      REDIS_URL: redis://:${CATALOG_REDIS_PASSWORD}@catalog-redis:6379/0
      REDIS_KEY_PREFIX: catalog:v1
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gelatoflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gelatoflow-api}
      REQUEST_TIMEOUT: 3s
    networks:
      - gelato_network
    depends_on:
      catalog-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3002/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  batch-inventory-service:
    build:
      context: ../../batch-inventory-service
    container_name: batch-inventory-service
    command:
      - sh
      - -c
      - /app/migrate && exec /app/inventory
    environment:
      HTTP_ADDR: ":3004"
      GRPC_ADDR: ":50051"
      DATABASE_URL: postgres://${INVENTORY_POSTGRES_USER}:${INVENTORY_POSTGRES_PASSWORD}@inventory-postgres:5432/${INVENTORY_POSTGRES_DB}?sslmode=disable
      CATALOG_GRPC_ADDR: catalog-service:50052
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gelatoflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gelatoflow-api}
      ORDER_SERVICE_TOKEN: ${ORDER_SERVICE_TOKEN:?ORDER_SERVICE_TOKEN is required}
      REQUEST_TIMEOUT: 3s
      RESERVATION_TTL: 10m
      SWEEP_INTERVAL: 1s
      PUBLISH_EVENTS: "true"
      RABBITMQ_URL: amqp://${INVENTORY_RABBITMQ_USER:-inventory_service}:${INVENTORY_RABBITMQ_PASSWORD:-inventory_dev_password}@rabbitmq:5672/gelato_vhost
    networks:
      - gelato_network
    depends_on:
      inventory-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3004/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s

  payment-service:
    build:
      context: ../..
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    env_file:
      - path: ../../payment-service/.env
        required: false
    environment:
      PORT: "3007"
      PAYMENT_GRPC_PORT: "50057"
      PAYMENT_GRPC_TLS: "false"
      PAYMENT_REQUEST_TOKEN: ${PAYMENT_REQUEST_TOKEN:?PAYMENT_REQUEST_TOKEN is required}
      ORDER_SERVICE_TOKEN: ${ORDER_SERVICE_TOKEN:?ORDER_SERVICE_TOKEN is required}
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:?PAYMENT_SERVICE_TOKEN is required}
      ORDER_GRPC_TARGET: order-service:50054
      ORDER_GRPC_TLS: "false"
      ORDER_HTTP_BASE_URL: http://order-service:3003
      PAYMENT_CALLBACK_ALLOW_PLAINTEXT: "true"
      STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:-http://localhost:3000/payment/success?session_id={CHECKOUT_SESSION_ID}}
      STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:-http://localhost:3000/payment/cancel}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gelatoflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gelatoflow-api}
    networks:
      - gelato_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3007/actuator/health/liveness || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  order-service:
    build:
      context: ../../order-service
    container_name: order-service
    environment:
      PORT: "3003"
      DATABASE_URL: host=order-postgres user=${ORDER_POSTGRES_USER} password=${ORDER_POSTGRES_PASSWORD} dbname=${ORDER_POSTGRES_DB} port=5432 sslmode=disable
      RABBITMQ_URL: amqp://${ORDER_RABBITMQ_USER:-order_service}:${ORDER_RABBITMQ_PASSWORD:-order_dev_password}@rabbitmq:5672/gelato_vhost
      BATCH_INVENTORY_GRPC_URL: batch-inventory-service:50051
      ORDER_SERVICE_TOKEN: ${ORDER_SERVICE_TOKEN:?ORDER_SERVICE_TOKEN is required}
      CATALOG_GRPC_URL: catalog-service:50052
      PAYMENT_SERVICE_TOKEN: ${PAYMENT_SERVICE_TOKEN:?PAYMENT_SERVICE_TOKEN is required}
      PAYMENT_GRPC_URL: payment-service:50057
      PAYMENT_REQUEST_TOKEN: ${PAYMENT_REQUEST_TOKEN:?PAYMENT_REQUEST_TOKEN is required}
      PAYMENT_REQUEST_TIMEOUT: 5s
    networks:
      - gelato_network
    depends_on:
      order-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      batch-inventory-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:3003/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  api-gateway:
    build:
      context: ../../api-gateway
    container_name: api-gateway
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth-service:3001
      CATALOG_SERVICE_URL: http://catalog-service:3002
      ORDER_SERVICE_URL: http://order-service:3003
      INVENTORY_SERVICE_URL: http://batch-inventory-service:3004
      FULFILLMENT_SERVICE_URL: http://fulfillment-service:8080
      ANALYTICS_SERVICE_URL: http://analytics-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:3007
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-gelatoflow-auth}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-gelatoflow-api}
    networks:
      - gelato_network
    depends_on:
      auth-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      batch-inventory-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      fulfillment-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  gelato_network:
    driver: bridge

volumes:
  rabbitmq_data:
  analytics_mongodb_data:
  auth_postgres_data:
  inventory_postgres_data:
  fulfillment_postgres_data:
  order_postgres_data:
  catalog_redis_data:
