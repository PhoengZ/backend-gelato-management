name: gelato-management

services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: rabbitmq
    env_file:
      - ../.env
    networks:
      - gelato_network
    volumes:
      - ../rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ../rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ../rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 30s
      timeout: 10s
      retries: 5

  analytics-mongodb:
    image: mongo:7.0
    container_name: analytics-mongodb
    networks:
      - gelato_network
    env_file:
      - ../../analytics-service/.env
    volumes:
      - analytics_mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      test: mongosh --quiet --eval "db.adminCommand('ping').ok" localhost:27017/test
      interval: 10s
      timeout: 5s
      retries: 10

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: ${AUTH_POSTGRES_DB:?AUTH_POSTGRES_DB is required}
      POSTGRES_USER: ${AUTH_POSTGRES_USER:?AUTH_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${AUTH_POSTGRES_PASSWORD:?AUTH_POSTGRES_PASSWORD is required}
    networks:
      - gelato_network
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  inventory-postgres:
    image: postgres:16-alpine
    container_name: inventory-postgres
    environment:
      POSTGRES_DB: ${INVENTORY_POSTGRES_DB:?INVENTORY_POSTGRES_DB is required}
      POSTGRES_USER: ${INVENTORY_POSTGRES_USER:?INVENTORY_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${INVENTORY_POSTGRES_PASSWORD:?INVENTORY_POSTGRES_PASSWORD is required}
    networks:
      - gelato_network
    volumes:
      - inventory_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10

  catalog-redis:
    image: redis:7-alpine
    container_name: catalog-redis
    environment:
      REDIS_PASSWORD: ${CATALOG_REDIS_PASSWORD:?CATALOG_REDIS_PASSWORD is required}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    networks:
      - gelato_network
    volumes:
      - catalog_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  analytics-service:
    image: phoeng/analytics-service:1.0.0
    container_name: analytics-service
    env_file:
      - path: ../../analytics-service/.env
    networks:
      - gelato_network
    depends_on:
      rabbitmq:
        condition: service_healthy
      analytics-mongodb:
        condition: service_healthy
    restart: unless-stopped

networks:
  gelato_network:
    driver: bridge

volumes:
  rabbitmq_data:
  analytics_mongodb_data:
  auth_postgres_data:
  inventory_postgres_data:
  catalog_redis_data:
