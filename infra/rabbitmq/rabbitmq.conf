# Disable default guest user
loopback_users.guest = false

# Load definitions (Disabled by default to allow .env to seed the admin user)
# management.load_definitions = /etc/rabbitmq/definitions.json

# Networking listeners
listeners.tcp.default = 5672
management.tcp.port = 15672

# Resource limits to prevent leaks
# Global connection limits are typically bound by OS file descriptors.
channel_max = 2048

# Timeout and health-checks (detect dead TCP connections)
heartbeat = 60

# Consumer timeout: 5 minutes (300000 ms). 
# If a service pulls a message but dies before sending an ACK, the broker will forcefully 
# close the channel and requeue the message instead of hanging indefinitely.
# 5 minutes is a standard safeguard for microservices unless processing heavy background jobs.
consumer_timeout = 300000
