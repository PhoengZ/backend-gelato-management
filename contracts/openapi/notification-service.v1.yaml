openapi: 3.1.0
info:
  title: GelatoFlow Notification Service API
  version: 1.0.0
  description: >-
    Real-time in-app notifications over Server-Sent Events. Notification is
    stateless: it consumes `order.placed`, `order.cancelled`,
    `fulfillment.order_queued`, `fulfillment.order_ready`, `inventory.low_stock`
    and `inventory.expiring`
    from RabbitMQ and pushes a frame to the connected users it applies to. It
    owns no business data and exposes no operation for other services to call.


    Delivery is best effort. Notifications are kept in an in-memory buffer for
    five minutes (at most 500 per user or role) and replayed when a stream
    opens, as described on the stream operation. Anything older, or anything
    sent before the service restarted, is lost, so clients keep polling order
    status as a fallback.


    Browsers' `EventSource` cannot send an `Authorization` header. Clients use
    a fetch-based SSE reader (for example `@microsoft/fetch-event-source`).


    Recipients: customers receive only notifications for their own orders
    (the owner is learned from `order.placed`, so an order placed before this
    service started, or older than its retention window, produces no
    notification). Staff and managers receive inventory alerts.
servers:
  - url: /
paths:
  /api/v1/notifications/stream:
    get:
      operationId: streamNotifications
      summary: Open the notification stream for the authenticated user
      description: >-
        Holds the connection open and writes one SSE frame per notification,
        plus `: keep-alive` comment lines. Each frame has `id` (the source
        event id), `event` (the notification `type`) and `data` (a JSON
        `Notification`, described by the schema below). The stream ends with a
        `: token-expired` comment when the access token expires; reconnect with
        a fresh token and `Last-Event-ID`.


        Replay happens before live events. With a `Last-Event-ID` header (or a
        `last_event_id` query parameter) the stream first sends the buffered
        notifications after that id, or every buffered one if the id is no
        longer in the buffer. Without an id it first sends every
        notification still buffered for the user, plus broadcasts to the
        user's role, so a page opened shortly after an event still shows it.
        The buffer keeps notifications for five minutes. A notification can
        therefore arrive more than once across connections; clients
        deduplicate by notification `id`. `GET /health` is also served for liveness but is not part
        of the public contract. The API Gateway routes this path to the
        service through its streaming proxy.
      tags: [Notifications]
      security:
        - bearerAuth: []
      x-required-roles: [CUSTOMER, STAFF, MANAGER]
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: >-
            Id of the last notification the client received. Omit it to replay
            every buffered notification. An id that is not a UUID disables replay.
          schema:
            type: string
            format: uuid
        - name: last_event_id
          in: query
          required: false
          description: Same as the `Last-Event-ID` header, for clients that cannot set it.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/Notification'
              example:
                id: 5b0c1f1e-3a52-4d8c-9a41-0d6f4f0f7a10
                type: order.ready
                message: Your gelato order is ready for pickup!
                occurred_at: '2026-09-02T14:55:00Z'
                data:
                  order_id: 8d29d6cf-bd4d-48ca-9e4f-dcd8ec54e594
                  queue_number: '01'
                  pickup_slot_id: b4a2f6c8-2f0e-4c3a-8a57-6f0f6f3a9d21
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: Missing, malformed, expired or otherwise invalid Bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Notification:
      type: object
      additionalProperties: false
      required: [id, type, message, occurred_at, data]
      properties:
        id:
          type: string
          format: uuid
          description: Id of the source event; also the SSE `id`.
        type:
          $ref: '#/components/schemas/NotificationType'
        message:
          type: string
          description: Human-readable popup text.
        occurred_at:
          type: string
          format: date-time
          description: Time of the source event.
        data:
          description: Type-specific fields; the shape depends on `type`.
          oneOf:
            - $ref: '#/components/schemas/OrderConfirmedData'
            - $ref: '#/components/schemas/OrderReadyData'
            - $ref: '#/components/schemas/OrderCancelledData'
            - $ref: '#/components/schemas/LowStockData'
            - $ref: '#/components/schemas/ExpiringData'
    NotificationType:
      type: string
      description: >-
        `order.confirmed` (from `fulfillment.order_queued`, sent once per order
        and carrying the queue number), `order.ready` (from
        `fulfillment.order_ready`) and `order.cancelled` go to the order owner.
        `order.placed` only records the order owner and pushes nothing.
        `inventory.low_stock` and `inventory.expiring` go to STAFF and MANAGER.
      enum:
        - order.confirmed
        - order.ready
        - order.cancelled
        - inventory.low_stock
        - inventory.expiring
    OrderConfirmedData:
      type: object
      additionalProperties: false
      description: >-
        Sent when Fulfillment has queued the order. The queue number is scoped
        to the pickup slot.
      required: [order_id, queue_number, pickup_at, pickup_slot_id]
      properties:
        order_id:
          type: string
          format: uuid
        queue_number:
          type: string
          description: Display string allocated by Fulfillment, scoped to the pickup slot.
          example: '01'
        pickup_at:
          type: string
          format: date-time
        pickup_slot_id:
          type: string
          format: uuid
    OrderReadyData:
      type: object
      additionalProperties: false
      required: [order_id, queue_number, pickup_slot_id]
      properties:
        order_id:
          type: string
          format: uuid
        queue_number:
          type: string
          description: Display string allocated by Fulfillment, scoped to the pickup slot.
          example: '01'
        pickup_slot_id:
          type: string
          format: uuid
    OrderCancelledData:
      type: object
      required: [order_id, reason]
      properties:
        order_id:
          type: string
          format: uuid
        reason:
          type: string
          description: Stable reason code owned by Order Service.
    LowStockData:
      type: object
      description: >-
        Source event has no JSON schema yet (Inventory does not publish it);
        this shape follows docs/event-schema-spec.md.
      required: [batch_id, flavor_id, remaining_portions, threshold_portions]
      properties:
        batch_id:
          type: string
          format: uuid
        flavor_id:
          type: string
          format: uuid
        remaining_portions:
          type: integer
        threshold_portions:
          type: integer
    ExpiringData:
      type: object
      description: >-
        Source event has no JSON schema yet (Inventory does not publish it);
        this shape follows docs/event-schema-spec.md.
      required: [batch_id, flavor_id, expires_at]
      properties:
        batch_id:
          type: string
          format: uuid
        flavor_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
