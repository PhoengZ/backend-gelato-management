openapi: 3.1.0
info:
  title: GelatoFlow Fulfillment Service API
  version: 1.0.0
  description: >-
    Kitchen preparation queue and pickup status. Fulfillment creates a ticket
    from the `order.placed` event and owns the ticket lifecycle; it does not
    own order, payment, or inventory data.
servers:
  - url: /
paths:
  /api/v1/fulfillments:
    get:
      operationId: listFulfillments
      summary: List fulfillment tickets for the kitchen queue
      tags: [Fulfillment]
      security:
        - bearerAuth: []
      x-required-roles: [STAFF, MANAGER]
      parameters:
        - name: status
          in: query
          required: false
          description: Comma-separated statuses to include. Defaults to all statuses.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FulfillmentStatus'
        - name: pickup_from
          in: query
          required: false
          description: Include tickets with `pickup_at` at or after this time. Defaults to no lower bound.
          schema:
            type: string
            format: date-time
        - name: pickup_to
          in: query
          required: false
          description: >-
            Include tickets with `pickup_at` before this time. Defaults to no
            upper bound. Must be after `pickup_from` when both are given.
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Fulfillment tickets ordered by pickup time, then queue number
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Fulfillment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/fulfillments/{order_id}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getFulfillment
      summary: Get the fulfillment ticket for an order
      description: >-
        Staff and managers can read any ticket. A customer can read only the
        ticket for their own order, so the queue number stays available when
        real-time notifications fail. Other tickets return 404 to customers.
      tags: [Fulfillment]
      security:
        - bearerAuth: []
      x-required-roles: [CUSTOMER, STAFF, MANAGER]
      responses:
        '200':
          description: Fulfillment ticket found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/fulfillments/{order_id}/history:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      operationId: getFulfillmentHistory
      summary: Get the immutable status history of a fulfillment ticket
      description: >-
        Audit trail of every status change, oldest first. `actor_id` is set for
        staff actions; `source_event_id` is set for changes caused by an event.
      tags: [Fulfillment]
      security:
        - bearerAuth: []
      x-required-roles: [MANAGER]
      responses:
        '200':
          description: Status history of the ticket
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FulfillmentStatusHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/fulfillments/{order_id}/status:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    patch:
      operationId: updateFulfillmentStatus
      summary: Advance a fulfillment ticket to the next status
      description: >-
        Allowed transitions are PREPARING to READY_FOR_PICKUP and
        READY_FOR_PICKUP to PICKED_UP. Repeating the current status is a no-op
        that does not publish another event.
      tags: [Fulfillment]
      security:
        - bearerAuth: []
      x-required-roles: [STAFF, MANAGER]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFulfillmentStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fulfillment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Insufficient role
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Fulfillment ticket not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidTransition:
      description: The requested status is not a valid next status for the ticket
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    Fulfillment:
      type: object
      additionalProperties: false
      required:
        [id, order_id, queue_number, pickup_slot_id, pickup_at, status, items, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        order_id:
          type: string
          format: uuid
        queue_number:
          type: string
          description: Display string allocated by Fulfillment, scoped to the pickup slot.
          example: '01'
        pickup_slot_id:
          type: string
          format: uuid
        pickup_at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/FulfillmentStatus'
        items:
          type: array
          description: Order-line snapshot copied from `order.placed`.
          items:
            $ref: '#/components/schemas/FulfillmentItem'
        picked_up_at:
          type: [string, 'null']
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    FulfillmentItem:
      type: object
      additionalProperties: false
      required: [flavor_id, flavor_name, portions]
      properties:
        flavor_id:
          type: string
          format: uuid
        flavor_name:
          type: string
        portions:
          type: integer
          minimum: 1
    FulfillmentStatus:
      type: string
      enum: [PREPARING, READY_FOR_PICKUP, PICKED_UP, CANCELLED]
    FulfillmentStatusHistory:
      type: object
      additionalProperties: false
      required: [id, fulfillment_id, new_status, created_at]
      properties:
        id:
          type: string
          format: uuid
        fulfillment_id:
          type: string
          format: uuid
        old_status:
          $ref: '#/components/schemas/FulfillmentStatus'
        new_status:
          $ref: '#/components/schemas/FulfillmentStatus'
        actor_id:
          type: string
          format: uuid
          description: User who made the change; omitted for event-driven changes.
        source_event_id:
          type: string
          format: uuid
          description: CloudEvent id that caused the change; omitted for staff actions.
        created_at:
          type: string
          format: date-time
    UpdateFulfillmentStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [READY_FOR_PICKUP, PICKED_UP]
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties:
            type: string
