syntax = "proto3";

package inventory;

option go_package = "order-service/pkg/pb;pb";

service InventoryService {
  rpc ReservePortions (ReserveRequest) returns (ReserveResponse);
}

message OrderItem {
  string flavor_id = 1;
  int32 portions = 2;
}

message ReserveRequest {
  string order_id = 1;
  repeated OrderItem items = 2;
}

message ReserveResponse {
  bool success = 1;
  string message = 2;
}
