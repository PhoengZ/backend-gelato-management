name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created, edited]

permissions:
  issues: write
  pull-requests: write
  contents: write

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    steps:
      - name: PR Agent action step
        id: pragent
        uses: the-pr-agent/pr-agent@main
        env:
          # LiteLLM needs GROQ_API_KEY for groq/ prefixed models
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # PR-Agent might still expect OPENAI_KEY to be set
          OPENAI_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # LiteLLM routing prefix for Groq API
          CONFIG.MODEL: "groq/qwen/qwen3.6-27b"
          
          # Fallback model in case of rate limits or errors
          CONFIG.FALLBACK_MODELS: "openai/gpt-oss-120b"
          
          # Specify max tokens for custom models not built into PR-Agent
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32000"
          
          # Enable custom reasoning model to properly parse <think> tags
          CONFIG.CUSTOM_REASONING_MODEL: "true"
          
          # Enable automatic AI features when a PR is opened
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
          
          # Enable reviewing again when new commits are pushed (synchronize event)
          github_action_config.handle_push_trigger: "true"
          github_action_config.push_commands: '["review"]'
