name: Example Microservice CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'example-service/**'
      # Add relevant shared contracts or proto paths if this service depends on them:
      # - 'contracts/proto/example/**'
      # - 'contracts/events/**'
      - '.github/workflows/example-service.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'example-service/**'
      # - 'contracts/proto/example/**'
      # - 'contracts/events/**'
      - '.github/workflows/example-service.yaml'

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Security Scan, Code Quality, and Tests
    runs-on: ubuntu-latest

    # Optional: Attach service containers for live integration tests (e.g. PostgreSQL, MongoDB, RabbitMQ, Redis)
    # services:
    #   postgres:
    #     image: postgres:16-alpine
    #     env:
    #       POSTGRES_USER: test_user
    #       POSTGRES_PASSWORD: test_password
    #       POSTGRES_DB: test_db
    #     ports: ['5432:5432']
    #     options: --health-cmd "pg_isready -U test_user -d test_db" --health-interval 5s --health-timeout 5s --health-retries 10
    #   rabbitmq:
    #     image: rabbitmq:4-alpine
    #     ports: ['5672:5672']
    #     options: --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 5s --health-timeout 5s --health-retries 15

    # Define working directory for steps that need it
    defaults:
      run:
        working-directory: ./example-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for TruffleHog to scan full history

      - name: Secret Scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: example-service/go.mod
          cache-dependency-path: example-service/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Code Formatting Check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Static Code Analysis (Vet)
        run: go vet ./...

      - name: Run Tests
        run: go test -v -count=1 ./...

  build-and-scan-image:
    name: Build Docker Image and Trivy Scan
    runs-on: ubuntu-latest
    needs: security-and-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build -t example-service:${{ github.sha }} ./example-service

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'example-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
