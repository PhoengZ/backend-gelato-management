name: Catalog Service CI

on:
  push:
    branches: ["main"]
    paths:
      - "catalog-service/**"
      - "contracts/openapi/catalog-service.v1.yaml"
      - ".github/workflows/catalog-service.yaml"
  pull_request:
    branches: ["main"]
    paths:
      - "catalog-service/**"
      - "contracts/openapi/catalog-service.v1.yaml"
      - ".github/workflows/catalog-service.yaml"

permissions:
  contents: read

jobs:
  test:
    name: Format, vet, and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-service
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: catalog-service/go.mod
          cache-dependency-path: catalog-service/go.sum

      - name: Verify dependencies
        run: go mod verify

      - name: Check formatting
        run: test -z "$(gofmt -s -l .)"

      - name: Vet packages
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  image:
    name: Build container image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t gelatoflow/catalog-service:${{ github.sha }} ./catalog-service
