name: API Gateway CI/CD

on:
  push:
    branches: [ "main" ]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yaml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'api-gateway/**'
      - '.github/workflows/api-gateway.yaml'

permissions:
  contents: read

jobs:
  security-and-quality:
    name: Security Scan, Code Quality, and Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./api-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api-gateway/go.mod
          cache-dependency-path: api-gateway/go.sum

      - name: Verify Dependencies
        run: go mod verify

      - name: Code Formatting Check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted correctly:"
            gofmt -s -l .
            exit 1
          fi

      - name: Static Code Analysis (Vet)
        run: go vet ./...

      - name: Run Unit & Integration Tests
        run: go test -v -count=1 ./...

  build-and-scan-image:
    name: Build Docker Image and Trivy Scan
    runs-on: ubuntu-latest
    needs: security-and-quality

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build an image from Dockerfile
        run: |
          docker build -t api-gateway:${{ github.sha }} ./api-gateway

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'api-gateway:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
